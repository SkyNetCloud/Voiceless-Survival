import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "com.modrinth.minotaur"
    id 'net.darkhax.curseforgegradle'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

def changelogText = project.file('changelog.md').text
def site_debugMode = false

repositories {
    maven { url = "https://maven.maxhenkel.de/repository/public" }
    maven { url = "https://api.modrinth.com/maven" }
    maven {
        url "https://jitpack.io"
        content { includeGroup "com.github.FiguraMC.luaj" }
    }
    mavenCentral()
}




dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    implementation "curse.maven:vics-point-blank-961053:${vic_point_blank_id}"
    implementation "curse.maven:unofficial-tacz-refabricated-1627909:${unofficial_tacz_refabricated}"
    runtimeOnly "curse.maven:plasmo-voice-467028:${plasmo_voice_id}"
    runtimeOnly "maven.modrinth:simple-voice-chat:fabric-${voicechat_version}"
    api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"

    // --- Plain libraries
    implementation "org.apache.bcel:bcel:${bcel_version}"
    implementation "org.apache.commons:commons-math3:${commons_math3_version}"
    implementation "com.maydaymemory:mae:${mae_version}"

    implementation "com.github.FiguraMC.luaj:luaj-jse:${luaj_fse_version}"
    include "com.github.FiguraMC.luaj:luaj-jse:${luaj_fse_version}"

    implementation "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

    compileOnly "com.electronwill.night-config:toml:${toml_version}"
    compileOnly("su.plo.voice.api:client:${plasmovoice_api_version}")
    compileOnly("su.plo.voice.api:server:${plasmovoice_api_version}")
}


processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "voicechat_api_version", project.voicechat_api_version
    inputs.property "plasmovoice_api_version", project.plasmovoice_api_version
    inputs.property "forge_config_api_port_version", project.forge_config_api_port_version

    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "voicechat_api_version": project.voicechat_api_version,
                "plasmovoice_api_version": project.plasmovoice_api_version,
                "forge_config_api_port_version": project.forge_config_api_port_version
        )
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.mod_group_id}" }
    }
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    def mainFile = upload('1173633', file("build/libs/${mod_id}-${mod_version}.jar"))
    mainFile.displayName = "${mod_name}-${mod_version}"
    mainFile.releaseType = 'release'
    mainFile.changelog = changelogText
    debugMode = site_debugMode
    mainFile.addEnvironment("Client", "Server")


    mainFile.addRequirement("forge-config-api-port")
    mainFile.addOptional("vics-point-blank")
    mainFile.addOptional("simple-voice-chat")
    mainFile.addOptional("plasmo-voice")
    mainFile.addOptional("unofficial-tacz-refabricated")

}


modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "voiceless-survival"
    versionName = "${mod_name} ${mod_version}"
    versionNumber = "${mod_version}"
    versionType = "release"
    // 26.1 has no remapJar, so the plain jar is the output
    uploadFile = file("build/libs/${mod_id}-${mod_version}.jar")
    gameVersions = ["${minecraft_version}"] as Iterable<? extends String>

    loaders = ["fabric"]
    changelog = changelogText
    debugMode = site_debugMode


    dependencies {
        required.project "fabric-api"
        required.project 'forge-config-api-port'
        optional.project 'vics-point-blank'
        optional.project 'simple-voice-chat'
        optional.project 'plasmo-voice'
    }
}


// Uploads to the sites above
tasks.register('publicModdedSite') {
    dependsOn 'build'
    dependsOn 'publishCurseForge'
    dependsOn 'modrinth'
}