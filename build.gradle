plugins {
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.+' apply false
}

subprojects {
    if (name == 'modules') {
        tasks.configureEach {
            enabled = false
        }
        return
    }

    apply plugin: 'java'

    def java17Projects = [
            'fabric_1.18.2',
            'fabric_1.19.2',
            'fabric_1.20.1'
    ]

    def java21Projects = [
            'fabric_1.21.1',
            'fabric_1.21.4',
            'fabric_1.21.11'
    ]

    // Java version: 26.x and up -> 25, otherwise use the explicit lists above.
    // Assumes module names look like fabric_<mcversion>.
    def javaVersion = null
    def versionMatch = name =~ /^fabric_(\d+)\./
    if (versionMatch.find() && versionMatch.group(1).toInteger() >= 26) {
        javaVersion = 25
    } else if (java17Projects.contains(name)) {
        javaVersion = 17
    } else if (java21Projects.contains(name)) {
        javaVersion = 21
    }

    if (javaVersion != null) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(javaVersion)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = javaVersion
        }
    }

    repositories {
        mavenCentral()

        maven {
            name = 'MaxHenkel'
            url = 'https://maven.maxhenkel.de/repository/public'
        }

        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }

        maven {
            name = 'PlasmoVerse'
            url = 'https://repo.plasmoverse.com/releases'
        }

        maven {
            name = 'JitPack'
            url = 'https://jitpack.io'
            content {
                includeGroup 'com.github.FiguraMC.luaj'
            }
        }

        maven {
            name = 'CurseMaven'
            url = 'https://www.cursemaven.com'
            content {
                includeGroup 'curse.maven'
            }
        }

        maven {
            name = 'ImpactDev'
            url = 'https://maven.impactdev.net/repository/development/'
        }

        maven {
            name = 'Fuzs'
            url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        }

        maven {
            name = 'DevOS'
            url = 'https://mvn.devos.one/releases/'
        }

        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }

        maven {
            name = 'Terraformers'
            url = 'https://maven.terraformersmc.com/'
        }

        maven {
            url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        }
    }
}


tasks.register('publicMod') {
    group = 'publishing'
    description = 'Publishes supported Fabric versions'

    def targetSubprojects = [
            'fabric_1.18.2',
            'fabric_1.19.2',
            'fabric_1.20.1',
            'fabric_1.21.1',
            'fabric_1.21.4',
            'fabric_1.21.11',
            'fabric_26.1.2',
            'fabric_26.3'
    ]

    dependsOn subprojects
            .findAll { it.name in targetSubprojects }
            .collect { "${it.path}:publicModdedSite" }
}