pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

rootProject.name = 'Voiceless Survival'

// === FABRIC ===
include "modules:fabric_1.18.2"
include "modules:fabric_1.19.2"
include "modules:fabric_1.20.1"
include "modules:fabric_1.21.1"
include "modules:fabric_1.21.4"
// ----------

